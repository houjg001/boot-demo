spring.application.name: boot-db

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/boot-db?
    username: boot
    password: boot

  ssl:
    bundle:
      pem:
        grpc-server:
          keystore:
            certificate: classpath:certs/server-cert.pem
            private-key: classpath:certs/server-key-pkcs8.pem
          truststore:
            certificate: classpath:certs/ca-cert.pem

  grpc:
    server:
      ssl:
        bundle: grpc-server
        client-auth: require
      port: 9090
mybatis:
  mapper-locations:
    - classpath*:/org/**/mapper/**/*.xml

---

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/boot-db?
  config:
    activate:
      on-profile:
        - docker