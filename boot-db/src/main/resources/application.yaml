spring.application.name: boot-db
server:
  port: 8088
spring:
  datasource:

    url: jdbc:mysql://localhost:3306/boot-db?
    username: boot
    password: boot
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: false
mybatis:
  mapper-locations:
    - classpath*:/org/**/mapper/**/*.xml

