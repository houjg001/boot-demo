services:
  mysql:
    image: mysql:9.7.0
    container_name: mysql-local
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_TIME_ZONE: '+08:00'
      MYSQL_DATABASE: boot-db
      MYSQL_USER: boot
      MYSQL_PASSWORD: boot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-config/my.cnf:/etc/mysql/conf.d/my.cnf:0644

  boot-db:
    image: boot-db:0.0.1-SNAPSHOT
    container_name: boot-db
    ports:
      - "9090:9090"
    depends_on:
      - mysql

  boot-web:
    image: boot-web:0.0.1-SNAPSHOT
    container_name: boot-web
    ports:
      - "8080:8080"
    depends_on:
      - boot-db

volumes:
  mysql_data:
