services:
  mysql-9:
    image: mysql:9.7.0
    container_name: mysql-local
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_DATABASE: boot-db
      MYSQL_USER: boot
      MYSQL_PASSWORD: boot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
