services:
  mysql-9:
    image: mysql:9.7.0
    container_name: mysql-local
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_TIME_ZONE: '+08:00'
      MYSQL_DATABASE: boot-db
      MYSQL_USER: boot
      MYSQL_PASSWORD: boot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-config/my.cnf:/etc/mysql/conf.d/my.cnf:0644

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      TZ: "Asia/Shanghai"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'FMOHY6BMR_KV6zt2Skrz6Q' # cluster id
    volumes:
      - kafka_data:/var/lib/kafka/data

  loki:
    image: grafana/loki:3.7.7
    environment:
      TZ: "Asia/Shanghai"
    container_name: loki-local
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    environment:
      TZ: "Asia/Shanghai"
    container_name: otel-collector-local
    command: [ "--config=/etc/otelcol/config.yml" ]
    volumes:
      - ./docker-config/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana-local
    ports:
      - "3000:3000"
    environment:
      TZ: "Asia/Shanghai"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker-config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v3.14.0
    environment:
      TZ: "Asia/Shanghai"
    container_name: prometheus-local
    command: [ "--config.file=/etc/prometheus/prometheus.yml" ]
    volumes:
      - ./docker-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.7.1
    environment:
      TZ: "Asia/Shanghai"
    container_name: tempo-local
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./docker-config/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"


volumes:
  mysql_data:
  kafka_data:
  grafana-data:
