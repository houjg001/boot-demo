syntax = "proto3";
package grpc.proto.user;
option java_package = "org.example.grpc.service";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

service UserRpcService {
  rpc SelectUserById(UserIdReq) returns (UserIdReq.Response);
  rpc QueryUsers(UserQueryParam) returns (UserQueryParam.Response);
}

message UserInfo {
  uint64 user_id = 1;
  string user_name = 2;
  google.protobuf.Timestamp birthday = 3;
  string email = 4;
  repeated AddressInfo addresses = 5;
}
message AddressInfo {
  uint64 address_id = 1;
  string addr = 2;
  string postcode = 3;
}
message UserIdReq {
  uint64 user_id = 1;
  message Response {
    UserInfo user_info = 1;
  }
}
message UserQueryParam {
  string user_name = 1;
  string email = 2;
  string addr = 3;
  int32 page_num = 4;
  int32 page_size = 5;
  message Response {
    PageInfoMsg page_info = 6;
  }
}

message PageInfoMsg {
  int32 page_num = 1;
  int32 page_size = 2;
  int32 size = 3;
  int32 pages = 4;
  int64 total = 5;
  repeated UserInfo users = 6;
}