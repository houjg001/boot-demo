syntax = "proto3";
package org.example.grpc.proto;
option java_package = "org.example.grpc.service";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

service UserRpcService {
  rpc SelectUserById(UserIdReq) returns (UserIdReq.Response);
  rpc QueryUsers(UserQueryParam) returns (UserQueryParam.Response);
}

message UserInfo {
  uint64 user_id = 1;
  string user_name = 2;
  google.protobuf.Timestamp birthday = 3;
  string email = 4;
  repeated AddressInfo addresses = 5;
}
message AddressInfo {
  uint64 address_id = 1;
  string addr = 2;
  string postcode = 3;
}
message UserIdReq {
  uint64 userId = 1;
  message Response {
    UserInfo userInfo = 1;
  }
}
message UserQueryParam {
  string user_name =1;
  string email = 2;
  string addr = 3;
  int32 page_num = 4;
  int32 page_size = 5;
  message Response {
    repeated UserInfo userInfo = 1;
  }
}
