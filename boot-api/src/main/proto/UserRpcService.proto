syntax = "proto3";
package grpc.proto.user;
option java_package = "org.example.grpc.service";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

service UserRpcService {
  rpc SelectUserById(UserIdReqProto) returns (UserIdReqProto.Response);
  rpc QueryUsers(UserQueryProto) returns (UserQueryProto.Response);
}

message UserProto {
  uint64 user_id = 1;
  string user_name = 2;
  google.protobuf.Timestamp birthday = 3;
  string email = 4;
  repeated AddressProto addresses = 5;
}
message AddressProto {
  uint64 address_id = 1;
  string addr = 2;
  string postcode = 3;
}
message UserIdReqProto {
  uint64 user_id = 1;
  message Response {
    UserProto user_proto = 1;
  }
}
message UserQueryProto {
  string user_name = 1;
  string email = 2;
  string addr = 3;
  int32 page_num = 4;
  int32 page_size = 5;
  message Response {
    PageProto page_proto = 6;
  }
}

message PageProto {
  int32 page_num = 1;
  int32 page_size = 2;
  int32 pages = 3;
  int64 total = 4;
  repeated UserProto users = 5;
}